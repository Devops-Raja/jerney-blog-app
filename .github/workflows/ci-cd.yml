name: "Jerney Stack: Core CI/CD Pipeline"

on:
  push:
    branches:
      - devops
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-cd.yaml'

permissions:
  contents: write # Grants the workflow runner write access to push image tag updates back to Git

jobs:
  # ─── PHASE 1: EVALUATE & BUILD THE BACKEND MICROSERVICE ───
  build-backend:
    name: "Build & Ship Backend Engine"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and Push Backend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── PHASE 2: EVALUATE & BUILD THE FRONTEND MICROSERVICE ───
  build-frontend:
    name: "Build & Ship Frontend Client"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and Push Frontend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── PHASE 3: THE GITOPS MANIFEST PATCH LAYER ───
  deploy-gitops:
    name: "Sync GitOps Deployment Tree"
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install YQ (YAML Processor)"
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: "Patch Manifest Files with Unique Commit SHA"
        run: |
          # Use yq to programmatically swap the container image string within your split manifests
          yq -i '.spec.template.spec.containers[0].image = "${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:${{ github.sha }}"' deploy/k8s/03-backend-deployment.yaml
          yq -i '.spec.template.spec.containers[0].image = "${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:${{ github.sha }}"' deploy/k8s/04-frontend-deployment.yaml

      - name: "Commit Changes back to Git Repository"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add deploy/k8s/03-backend-deployment.yaml deploy/k8s/04-frontend-deployment.yaml
          
          # Only commit and push if changes were actually written to prevent dummy run pipelines
          if ! git diff --cached --exit-code; then
            git commit -m "chore(gitops): auto-update container tags to match sha ${{ github.sha }} [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No infrastructure changes detected. Skipping manifest tracking lifecycle."
          fi