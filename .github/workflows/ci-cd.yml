name: "Jerney Stack:   DevSecOps Pipeline"

on:
  push:
    branches:
      - devops
      - main
    paths:
      - 'k8s/**'
      - 'helm/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - devops
      - main
    paths:
      - 'k8s/**'
      - 'helm/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: write
  security-events: write

jobs:
  # ───────────────────────────────────────────────────────────
  # STAGE 1 & 2: LINT & SCA (Software Composition Analysis)
  # ───────────────────────────────────────────────────────────
  security-lint-sca:
    name: "Stage 1 & 2: Lint & SCA Validation"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      # STAGE 1: Linting Dockerfiles
      - name: "Lint Frontend Dockerfile (Hadolint)"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile
          failure-threshold: error

      - name: "Lint Backend Dockerfile (Hadolint)"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile
          failure-threshold: error

      # STAGE 2: SCA (Scanning open-source dependency vulnerabilities)
      - name: "SCA Dependency Scan: Frontend"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          exit-code: '1' # Fails the pipeline if vulnerabilities are discovered
          severity: 'CRITICAL'

      - name: "SCA Dependency Scan: Backend"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # ───────────────────────────────────────────────────────────
  # STAGE 3 & 4: BUILD ENGINE & CONTAINER IMAGE SCANNING
  # ───────────────────────────────────────────────────────────
  build-and-image-scan:
    name: "Stage 3 & 4: Build & Image Security Scan"
    needs: security-lint-sca
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STAGE 3: Build & Cache Containers Locally First
      - name: "Build Local Frontend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true # Loads image directly into local Docker engine cache instead of pushing
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:local
          build-args: |
            CACHE_DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Build Local Backend Image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:local
          build-args: |
            CACHE_DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # STAGE 4: Container Vulnerability Scanner (Trivy Image Scan)
      - name: "Image Vulnerability Scan: Frontend"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:local'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: "Image Vulnerability Scan: Backend"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:local'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # STAGE 3 (CONTINUED): Safe Registry Push after passing Scan Gates
      - name: "Push Secure Images to DockerHub"
        if: github.event_name == 'push' # Only push image tags on commits, not on standard PR reviews
        run: |
          # Retagging with build number execution count
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:b${{ github.run_number }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:local ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:b${{ github.run_number }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:local ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:latest
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:b${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:b${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:latest

  # ───────────────────────────────────────────────────────────
  # STAGE 5: IaC SCAN (Kubernetes Manifest Validation) terraform +k8
  # ───────────────────────────────────────────────────────────
  iac-security-scan:
    name: "Stage 5: Infrastructure as Code (IaC) Scan"
    needs: security-lint-sca
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps: 
      - name: "Checkout Codebase"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}     
      - name: "Run Checkov Static Analysis"
        shell: bash
        continue-on-error: true
        run: |
          # 1. Update pip to ensure we don't hit permission issues
          python3 -m pip install --upgrade pip
          
          # 2. Install specific versions to ensure compatibility
          pip install checkov==3.2.533 configargparse==1.5.3
          
          CHECKOV_BIN=$(python3 -m site --user-base)/bin/checkov

          # 4. Execute with --no-config to bypass local .checkov.yml issues
          $CHECKOV_BIN -d k8s/ \
            --framework kubernetes \
            --no-config

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_39,CKV_AWS_58  # Public EKS endpoint (intentional for dev)
          output_format: cli

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true  # Soft fail for K8s (some checks may not apply)
          output_format: cli

  # ───────────────────────────────────────────────────────────
  # STAGE 6: DEPLOY MANIFEST UPDATE (GitOps Commit Gate)
  # ───────────────────────────────────────────────────────────
  deploy-manifest-update:
    name: "Stage 6: Deploy Manifest Update"
    needs: [build-and-image-scan, iac-security-scan]
    if: github.event_name == 'push' # Only modifies infrastructure files upon actual code integration merge
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install YQ Processor"
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: "Patch k8 Manifest / helm values.yaml Files with Secure Build Numbers"
        run: |
          ##-- Use this if you deploy via k8 manifest--#
          #cd /home/runner/work/jerney-blog-app/jerney-blog-app
          #grep -r "name: jerney-frontend" k8s/
          #ls -l k8s/backend.yml k8s/frontend.yml
          #yq -i '.spec.template.spec.containers[0].image = "${{ secrets.DOCKERHUB_USERNAME }}/jerney-backend:b${{ github.run_number }}"' k8s/backend.yml
          #yq -i '.spec.template.spec.containers[0].image = "${{ secrets.DOCKERHUB_USERNAME }}/jerney-frontend:b${{ github.run_number }}"' k8s/frontend.yml

          # Update Helm values.yaml to ensure ArgoCD deploys the correct new image tags as well
          cd /home/runner/work/jerney-blog-app/jerney-blog-app
          ls -l helm/jerney-blog-app/values.yaml
          yq -i '.backend.image.tag = "b${{ github.run_number }}"' helm/jerney-blog-app/values.yaml
          yq -i '.frontend.image.tag = "b${{ github.run_number }}"' helm/jerney-blog-app/values.yaml
      - name: "Commit Safe State back to Git"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          #--use this if you deploy via k8 manifest: git add k8s/backend.yml k8s/frontend.yml --#
          git add helm/jerney-blog-app/values.yaml
          
          if ! git diff --cached --exit-code; then
            git commit -m "(gitops): update secure images to build b${{ github.run_number }} [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "Zero drift detected. Skipping manifest synchronization."
          fi