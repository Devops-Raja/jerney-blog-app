services:
  # ==========================================
  # FRONTEND SERVICE
  # ==========================================
  frontend:
    build:
      context: ./frontend # Path to  frontend directory
      dockerfile: Dockerfile
    container_name: journey-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started # Ensures frontend only starts when backend is healthy
    ports:
      - "80:8080"   # HTTP public traffic
    networks:
      - journey-network

    command: ["nginx", "-c", "/etc/nginx/conf.d/default.conf", "-g", "daemon off; pid /tmp/nginx.pid;"]
    # DevSecOps Hardening
    security_opt:
      - no-new-privileges:true
    read_only: true 
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/run:uid=101,gid=101,mode=0755
      - /var/log/nginx:uid=101,gid=101,mode=0755
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1028M

  # ==========================================
  # BACKEND SERVICE 
  # ==========================================
  backend:
    build:
      context: ./backend # Path to your backend directory
      dockerfile: Dockerfile
    container_name: journey-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # Waits for DB to be fully ready
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - NODE_ENV=production
    # DevSecOps: Removed public port mapping. 
    # The frontend/reverse-proxy talks to it via the internal network over port 8080.
    expose:
      - "5000" 
    networks:
      - journey-network
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck: # Added healthcheck so the frontend knows when the backend is truly ready
      # Native Node.js script that pings port 5000 without requiring curl/wget
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { if (r.statusCode === 200 || r.statusCode === 404) process.exit(0); else process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # DATABASE SERVICE (PostgreSQL)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: journey-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      ## create a .env on root directory for these variables
      
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - journey-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  trivy-cache:

networks:
  journey-network:
    driver: bridge