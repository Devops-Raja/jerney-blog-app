apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jerney-blog-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Devops-Raja/jerney-blog-app.git
    targetRevision: devops
    path: helm/jerney-blog-app
  destination:
    server: https://kubernetes.default.svc
    namespace: jerney
  syncPolicy:
    automated:
      selfHeal: true
      prune: true