apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: jerney
spec:
  clusterIP: None # Headless service keeps network identities stable
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jerney
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{.Values.postgres.image.repository}}:{{.Values.postgres.image.tag}}
          
          env:
            - name: PGDATA 
              value: /data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: jerney-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jerney-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jerney-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          # ─── DEVSECOPS BLOCK 3: VOLUMES & READ-ONLY BYPASSES ───
          volumeMounts:
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-storage              # Path inside container where Postgres writes data
              mountPath: /data # The physical block disk from AWS EBS
            - name: pg-run-volume
              mountPath: /var/run/postgresql       # In-memory location for database lock/socket files
            - name: pg-tmp-volume
              mountPath: /tmp


          
          resources:
          {{- toYaml .Values.postgres.resources | nindent 12 }}

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-storage
          persistentVolumeClaim:
             claimName: postgres-storage
        - name: pg-run-volume
          emptyDir: {}
        - name: pg-tmp-volume
          emptyDir: {}
          
            

  # ─── DYNAMIC STORAGE ARCHITECTURE ───#

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ] # Only one node can read/write to this disk at a time
        storageClassName: {{.Values.postgres.storage.className}} # Binds directly to the StorageClass defined above
        resources:
          requests:
            storage: {{.Values.postgres.storage.size}} # Requested disk allocation