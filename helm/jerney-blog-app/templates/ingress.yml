apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jerney-ingress
  namespace: jerney
  annotations:
   {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
           {{- range .Values.ingress.paths }}
           - path: {{ .path }}
             pathType: Prefix
             backend:
               service:
                 name: {{ .serviceName }}
                 port:
                   number: {{ .port }}
           {{- end }}
         