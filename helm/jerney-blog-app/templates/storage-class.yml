apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.postgres.storage.className }}
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete   ##auto delete when terraform destroy
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
