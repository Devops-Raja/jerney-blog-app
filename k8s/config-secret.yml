apiVersion: v1
kind: ConfigMap
metadata:
  name: jerney-config
  namespace: jerney
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres-service"  # Matches the headless service name of the database
  DB_PORT: "5432"
  DB_NAME: "jerney_db"

---
apiVersion: v1
kind: Secret
metadata:
  name: jerney-secret
  namespace: jerney
type: Opaque
stringData: # Plain text allowed here; K8s will encode it automatically
  DB_USER: "jerney_user"
  DB_PASSWORD: "jerney_pass_2026"
  DATABASE_URL: "postgres://jerney_user:jerney_pass_2026@postgres-service:5432/jerney_db"
