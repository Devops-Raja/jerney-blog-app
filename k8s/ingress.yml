apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jerney-ingress
  namespace: jerney
  annotations:
    # Change class to alb
    kubernetes.io/ingress.class: "alb"
    # Essential for ALB to work
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # This group name merges this with any other ingress sharing this name
    alb.ingress.kubernetes.io/group.name: shared-alb-group
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          # Note: This requires setting --rootpath=/argocd in ArgoCD config
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80